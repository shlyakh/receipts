# DRAFT. Model section for a future protocol-v1.3 addendum (protocol-v1.2 is the weather
# addendum, drafts/protocol-v1.2_weather.yaml). Not registered, not tagged.
# Written on 2026-11-13. Both rows have been run on the 6 gate origins only, never on the
# ordering_gate or the 52 scored origins. Write protocol-v1.3.yaml from this draft, add the
# DEVIATIONS line below, commit, tag protocol-v1.3, then score once.
version: protocol-v1.3 (draft)
based_on: protocol-v1
unchanged: >
  Everything in protocol-v1, protocol-v1.1 and protocol-v1.2: zones, horizon, origins,
  data rules, regimes, drop rule, bootstrap, the baseline model, the primary comparison, its bar, verdict rule
  and outcome sentences. Both rows below are secondary; neither can change the outcome
  sentence.

added_models:
  - name: lightgbm_competition
    label: LightGBM, competition-grade (BigDEAL 2022 feature design)
    secondary: true
    why: >
      The protocol-v1 LightGBM row uses exactly the lag regression's six inputs and loses to
      Vanilla with trend. Published competition entries use far richer exogenous features.
      This row tests whether Chronos-2 beats properly built gradient boosting, not only
      regressions (notes/model_families.md, section 3).
    source: https://arxiv.org/abs/2305.05575  # read on 2026-11-13 (ar5iv HTML)
    code: harness/baselines.py, lightgbm_competition (our own code), core environment
    library: lightgbm 4.7.0 (core/), no new dependency
    weights: not applicable (trained at every origin on data up to the cutoff)
    definition:
      fit: >
        One LightGBM model per origin, refitted at every origin on the trailing 730 days
        ending at the cutoff (hours with load present and > 0). Fitted on reanalysis
        temperature features; predicts with features built from the regime's series.
      target: >
        log(load) minus a linear trend in log(load) fitted by least squares on the training
        rows (time in years since the start of the window). LightGBM fits the residual; the
        forecast is exp(trend extrapolated over the horizon + predicted residual). No
        retransformation bias correction.
      lagged_load: >
        None, as in the cited entry ("conditioning on recent load is not viable for
        long-term forecasting"). The row therefore needs no 168-hour lag and has no own
        missing-lag rule; windows are still dropped under the protocol's window_drop_rule
        when any other forecaster's window is incomplete.
      horizon: >
        Direct: the 168 horizon rows are predicted in one call from their own calendar and
        temperature features. No recursion, no horizon-day feature (no load input depends
        on lead time).
      features:  # 91 columns, all fixed
        calendar: >
          From the local time (America/New_York) at the start of the hour: hour, day of
          week, month, ISO week, day of month, day of year, weekend, week of month
          ((day-1)//7+1), meteorological season, US federal holiday indicator (holidays
          package, as the other rows), holiday name as a fixed integer code (observed days
          share the holiday's code), days until the next and since the last holiday. No year
          term (the level is carried by the removed trend).
        temperature_current: T (the zone series every other model gets)
        temperature_lags: T at lags 1 to 48 hours (48 columns)
        temperature_rolling: >
          Trailing windows of 3 h, 24 h, 168 h and 720 h ending at the hour (inclusive);
          mean, max, min, median, std (20 columns); min_periods 1.
        temperature_daily: >
          Over the hours of the same local day: mean, max, min, median, std, max-min, and
          T minus the daily mean (7 columns). Origins are local midnight, so a horizon day
          contains horizon hours only.
        temperature_month_hour: >
          Mean T by (local month, local hour) over the training rows (all at or before the
          cutoff), and T minus that mean (2 columns).
      hyperparameters: >
        objective regression (L2, as in the entry's qualifying match); n_estimators 1000;
        learning_rate 0.05; num_leaves 31; min_child_samples 20; all other LightGBM
        parameters at their defaults (no feature or bagging subsampling, no early
        stopping); random_state 20261112; deterministic true; force_row_wise true;
        n_jobs 1.
      not_tuned: >
        The paper reports no hyperparameter values (it tuned with Optuna on time-ordered
        folds) and selected features by permutation importance. Neither step is repeated:
        the full candidate feature set above is used and the values are LightGBM defaults
        plus a fixed budget of 1,000 trees at rate 0.05, chosen before any run. The gate
        origins were used as a sanity check only; nothing was changed after seeing them.
      differences_from_the_entry: >
        One zone temperature series instead of four station summaries (Tavg, Tmed, Tmin,
        Tmax); a reduced daily aggregate set (six of the eleven functions) and only the mean
        for the month-hour aggregate; no feature selection; GBDT, not the DART booster of
        the final match; no tuning; 730-day window (the entry's window is not stated).

  - name: tabpfn_ts_v2_temperature
    label: TabPFN-TS (TabPFN v2 weights) with temperature
    secondary: true
    why: >
      A covariate-aware zero-shot model pretrained on synthetic tables only, so it cannot
      have memorised PJM load. Tests whether Chronos-2's gain from temperature is special.
    source: https://arxiv.org/abs/2501.02945
    code: models_ff/tabpfn_ts_v2.py (direct adapter; not through FoundationForecast)
    environment: models_ff/ (already installed; no new dependency)
    library: tabpfn-time-series 1.4.0, tabpfn 9.2.0
    weights:
      repo: Prior-Labs/TabPFN-v2-reg
      revision: 02a44705ff7790b50cded404bc59adb94da456a1
      file: tabpfn-v2-regressor-2noar4o2.ckpt
      file_commit_date: "2025-01-05T14:36:20+00:00"
      sha256: e2d4a06eeb4521dee71fc68d819e277ffb97614cc3695dc9ac3030dd9da36c21
      licence: Prior Labs License 1.1 (Apache 2.0 plus an attribution clause, section 10)
      gated: false (downloaded anonymously, no token, no licence click-through)
      why_this_file: >
        The default checkpoint of tabpfn-time-series 0.1.x to 1.0.x, the releases of the
        TabPFN-TS paper ("model_path": "2noar4o2" in their defaults.py, read on GitHub).
      n_windows_after_weights: all scored windows (weights predate the first scored origin)
    definition:
      mode: >
        LOCAL only. TabPFNTSPipeline(tabpfn_mode=LOCAL), model_path the pinned local file,
        device cpu, ignore_pretraining_limits true, compile false. Telemetry disabled and
        Hugging Face offline; network sockets, the cloud client and the checkpoint
        downloader raise if called; the adapter checks that the pipeline holds the local
        TabPFNRegressor (tests/test_tabpfn_lookahead.py).
      context: "4096 hours ending at the cutoff (the v2-era default; the paper found no gain beyond)"
      covariate: T, the regime's zone temperature, past and known-future
      features: >
        The installed package's defaults: known-covariate lags (1 and season) and trailing
        mean, running index, calendar features, automatic seasonal features. Timestamps are
        given in UTC.
      missing_load: rows with missing load in the context are dropped by the pipeline
      output: median of TabPFN's predictive distribution; quantiles 0.1, 0.5, 0.9
      regressor_settings: all other TabPFNRegressor arguments at tabpfn 9.2.0 defaults
      device_note: "CPU; MPS not used (CLAUDE.md allows it only after one window matches CPU)"
    runtime_cpu: >
      Measured on the 24 gate windows: mean 287 s per window (range 233 to 370 s), laptop
      CPU, with other jobs running. The 208 scored windows would take about 17 hours.

gate:
  - run on the 6 gate origins only, both regimes, before the tag
  - lookahead tests pass with both rows (tests/test_gates.py covers lightgbm_competition
    through MODELS; tests/test_tabpfn_lookahead.py covers the TabPFN adapter)
  - forecasts complete for every gate origin that the other models complete

scoring: the 52 scored origins are run once for each added row, after the tag protocol-v1.3

secondary_comparisons:
  - each row against the lag regression with temperature and against Vanilla with trend
  - >
    Chronos-2 with temperature against each row, forecast regime, per zone, same bootstrap,
    same 10% bar and verdict rule, reported as secondary.

proposed_deviations_line: >
  - **2026-11-1x, protocol-v1.3** (`protocol-v1.3.yaml`): added two secondary rows, a
  competition-grade LightGBM after the BigDEAL 2022 feature design (temperature and
  calendar only, detrended log target, fixed untuned hyperparameters) and TabPFN-TS with
  TabPFN v2 weights and temperature (local CPU, pinned checkpoint). The primary comparison,
  its baseline, bar, verdict rule and sentences are unchanged. Both rows were run on the
  gate origins first and on the scored origins once, after the tag `protocol-v1.3`.

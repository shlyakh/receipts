# Evaluation set for the judge: 11 candidates collected by Yuri, mostly via LinkedIn.
# Purpose: test /judge without depending on search.
# label_proposed: from a research pass on Nov 12, 2026. label_yuri: Yuri's blind label
# (from eval/label_sheet.md, which shows no proposed labels). Ground truth is label_yuri.
#
# Labels: ACCEPT_RUN | ACCEPT_STAGE3 | PARTIAL | REJECT
# Spec being judged against: PJM zonal hourly load, 168-hour horizon, weather covariates.

items:
  - id: item-01
    title: NVIDIA Kumo Forecast available in FoundationForecast
    candidate_type: library_feature
    discovered_via: https://www.linkedin.com/posts/azul-garza-ramirez_nvidias-kumo-forecast-is-already-available-share-7525972155621117969-YNDy/
    primary_sources:
      - https://huggingface.co/nvidia/Kumo-Forecast
      - https://github.com/NVIDIA/Kumo-TS
      - https://github.com/TimeCopilot/foundationforecast
      - https://docs.timecopilot.dev/foundationforecast/examples/kumo-family/
    claim: Point-forecast model usable through one API, with conformal prediction intervals added on top.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Runnable as a univariate row. No covariates and a short native horizon, so expect it to trail the weather regression; the test is interval coverage.

  - id: item-02
    title: Weather and zero-shot models on GB electricity demand (pre-registered backtest)
    candidate_type: practitioner_backtest
    discovered_via: https://www.linkedin.com/posts/andy-graham-moran_energyforecasting-foundationmodels-timeseries-share-7526664711933820928-nIBz/
    primary_sources:
      - https://zenodo.org/records/24161799
      - https://github.com/AndyMoran/gb-foundation-model-tests
    claim: Given the same weather, the best zero-shot model roughly ties a plain weather regression; weather improves every forecaster.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Directly replicable on PJM at 168 h. Day-ahead vs week-ahead is the horizon mismatch to note. Headline demo item.
    unverified: Numbers in the post were not confirmed against the Zenodo record.

  - id: item-03
    title: open-predico, open-source repo for energy forecasting competitions
    candidate_type: practitioner_backtest
    discovered_via: https://www.linkedin.com/posts/arnaud-verstraeten-is-awesome_im-launching-an-open-source-repo-to-win-share-7525973960845365249-1Rjv/
    primary_sources:
      - https://github.com/arnaud-vs/open-predico
      - https://huggingface.co/spaces/open-predico/dashboard
    claim: t0-gamma was the best commercially usable model in the author's wind-generation backtest.
    label_proposed: PARTIAL
    label_yuri:
    reason: Off-target quantity (generation, not load). Design patterns are reusable; the model claim routes to item-09.

  - id: item-04
    title: Conformal prediction across all FoundationForecast models
    candidate_type: library_feature
    discovered_via: https://www.linkedin.com/posts/azul-garza-ramirez_time-series-foundation-models-finally-meet-share-7523795684282601472-3cnZ/
    primary_sources:
      - https://docs.timecopilot.dev/foundationforecast/examples/conformal-prediction/
      - https://github.com/TimeCopilot/foundationforecast
    claim: Calibrated intervals for any model from its historical errors, without retraining.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Testable on PJM as native vs conformal interval coverage.
    unverified: The "63 models" count in the post.

  - id: item-05
    title: WeatherNext 3 vs physics-based weather forecasts (ML6 study)
    candidate_type: vendor_claim
    discovered_via: LinkedIn post by a Google employee (no URL captured)
    primary_sources:
      - https://www.ml6.eu/en/blog/googles-weathernext-3-better-weather-forecast-lower-imbalance-costs
    claim: Lower error than a physics model on wind speed, solar irradiance and temperature; lower imbalance costs for wind and solar farms.
    label_proposed: REJECT
    label_yuri:
    reason: About weather and generation, not load. Could matter later as a temperature covariate source (stage 3 only); data access is by request.

  - id: item-06
    title: System imbalance forecast beating the Belgian grid operator (ML6)
    candidate_type: vendor_claim
    discovered_via: LinkedIn post (no URL captured)
    primary_sources: []
    claim: Lower error than the operator's own imbalance forecast using public data only.
    label_proposed: REJECT
    label_yuri:
    reason: Off-target quantity and no primary source found. The judge should report the missing source, not invent one.

  - id: item-07
    title: Chronos-2 vs Timestral-209M on a Swiss town's load (alitiq)
    candidate_type: practitioner_backtest
    discovered_via: LinkedIn post (no URL captured)
    primary_sources: []
    claim: Timestral slightly ahead of Chronos-2 day-ahead on a 15-minute grid with weather and calendar covariates; Chronos-2 slightly ahead on the hourly grid.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Weak evidence (one series, one month) but both models are runnable, so the claim can be tested at 168 h on JC and DOM.

  - id: item-08
    title: LoRA-reprogrammed small LLM for household demand
    candidate_type: practitioner_backtest
    discovered_via: LinkedIn post (no URL captured)
    primary_sources: []
    claim: The reprogrammed LLM loses to zero-shot Chronos and ties simple neural baselines.
    label_proposed: REJECT
    label_yuri:
    reason: Household scale, needs training (outside the runnable class), and the author reports it underperforms.

  - id: item-09
    title: The Forecasting Company t0 model family
    candidate_type: model_release
    discovered_via: https://www.theforecastingcompany.com/
    primary_sources:
      - https://huggingface.co/theforecastingcompany/t0-gamma
      - https://huggingface.co/theforecastingcompany/t0-beta
      - https://arxiv.org/abs/2609.24559
    claim: Open-weight probabilistic model with known-future covariates, near the top of a public benchmark, usable commercially.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Runnable with covariates. Gated on Hugging Face (accept terms, set a token).

  - id: item-10
    title: TimesFM-3 release
    candidate_type: model_release
    discovered_via: https://www.linkedin.com/posts/subhiksha-mukuntharaj_timesfm-3-is-one-of-the-time-series-foundation-share-7506623497914241024-trr1/
    primary_sources:
      - https://github.com/google-research/timesfm
      - https://huggingface.co/google/timesfm-3.0-pytorch
      - https://research.google/blog/timesfm-3-a-zero-shot-foundation-model-for-multivariate-forecasting/
    claim: Native multivariate forecasting with past-only and known-future covariates, full horizon in one pass.
    label_proposed: ACCEPT_RUN
    label_yuri:
    reason: Runnable for evaluation. Weights are non-commercial, so license_ok_for_commercial is false.

  - id: item-11
    title: Video review of Timestral and t0-gamma topping a public benchmark
    candidate_type: paper
    discovered_via: YouTube video (URL truncated in the source doc)
    primary_sources:
      - https://mistral.ai/news/timestral/
      - https://github.com/mistralai/timestral
    claim: Both models lead a general benchmark; synthetic training data is increasingly important.
    label_proposed: PARTIAL
    label_yuri:
    reason: A secondary source making a generic benchmark claim, not a load claim. Routes to running Timestral and t0-gamma.

expected_counts:
  ACCEPT_RUN: 6      # items 1, 2, 4, 7, 9, 10
  PARTIAL: 2         # items 3, 11
  REJECT: 3          # items 5, 6, 8

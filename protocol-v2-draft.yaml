# DRAFT of protocol-v2. Not frozen, not tagged, nothing run under it. Written 2026-11-13.
# Items marked OPEN are Yuri's to decide; each carries a recommendation. Until the tag
# protocol-v2 exists, code written for it runs on gate origins only (CLAUDE.md rule 12).
version: protocol-v2
status: draft
based_on: protocol-v1.3
why_a_new_version: >
  protocol-v1 named its baseline before the search for the field's standards and used
  weather labels that turned out wrong. v1.1 to v1.3 corrected this with secondary rows
  only. v2 names a new primary comparison, which v1 cannot do.

# ------------------------------------------------------------------ carried over
unchanged_from_v1: >
  Horizon (168 hours), issue time (Monday 00:00 America/New_York), load source and rules,
  metrics, the whole-week paired bootstrap (2,000 draws, seed 20261112, 90% interval), the
  10% bar and the verdict rule, the idealised information set and its caveat.
weather:
  truth_and_history: ERA5 (Open-Meteo models=era5), decision 28
  primary_regime: forecast_aifs      # ECMWF AIFS Single, lead-matched as in v1.2
  secondary_regimes: [oracle_era5, forecast_gfs, forecast_ifs]
  variables: temperature only (decision 17 stands)
  weather_points: >
    Decision 36. A zone's temperature is the mean over its weather points. A weather point
    is an ERA5 grid cell (0.25 degree), named by its cell centre; it is not a weather
    station, and the word "station" is kept for PJM's real stations only. The cells for
    AEP and AE are listed under zones.selected (decision 37); DOM and JC keep their v1
    points.

# ------------------------------------------------------------------ primary comparison
primary_comparison:
  baseline: vanilla_benchmark_trend      # the field's standard, decision 26
  challenger: chronos2_temperature
  regime: forecast_aifs
  covariates: temperature only on both sides; calendar and other extras are secondary rows
  note: >
    We have already seen this pair on DOM and JC (0.94 to 1.04 under every weather
    source). A primary on those zones and weeks would not be a prediction.

zones:
  status: decided (Yuri, 2026-11-13, decision 33)
  primary: [AEP, AE]
  development: [DOM, JC]        # reported, never read as the primary result
  rule: >
    For each development zone, the primary zone is the PJM sub-BA in EIA-930 with the
    smallest standardised distance to it on seven load statistics over 2023-11-01 to
    2025-10-31 (before the first scored origin): log mean load, growth of shoulder-month
    load, summer/winter peak ratio, summer/shoulder and winter/shoulder mean ratios,
    weekday/weekend ratio, mean daily minimum/maximum. Excluded: DOM and JC, zones whose
    daily load anomaly correlates 0.95 or more with the development zone, zones under
    1,000 MW mean load, zones failing the v1 load rules.
  selected:
    AEP:
      name: American Electric Power
      matches: DOM
      distance: 1.56
      runner_up: AP             # used only if AEP fails a gate for data reasons
      # Decided (decision 37): the ERA5 grid cells that hold PJM's stations for the zone,
      # with PJM's weights (2026 Long-Term Load Forecast Supplement, Table 3). lat/lon is
      # the cell centre; station is the PJM station the cell was found from.
      weather_points:
        - {name: columbus, station: CMH, lat: 40.00, lon: -83.00, weight: 0.234}
        - {name: fort_wayne, station: FWA, lat: 41.00, lon: -85.25, weight: 0.227}
        - {name: charleston_wv, station: CRW, lat: 38.50, lon: -81.50, weight: 0.226}
        - {name: roanoke, station: ROA, lat: 37.25, lon: -80.00, weight: 0.162}
        - {name: akron_canton, station: CAK, lat: 41.00, lon: -81.50, weight: 0.151}
    AE:
      name: Atlantic City Electric
      matches: JC
      distance: 2.12
      runner_up: PE
      weather_points:
        - {name: atlantic_city_airport, station: ACY, lat: 39.50, lon: -74.50, weight: 1.0}
  record: >
    notes/zone_selection.md (the process and the reasons), tools/zone_selection/ (download,
    statistics, checks), results/zone_selection/ (statistics per zone, correlations, daily
    shapes, hashes of the raw downloads).
  disclosed: >
    The rule and its thresholds were written on 2026-11-13 with the load of all 20 zones
    in view (descriptive statistics only; no model was run on any new zone). AE borders
    JC (anomaly correlation 0.93); with the limit at 0.90 the JC pick would be PEP, which
    is not summer-peaking. Yuri chose AE to keep the summer-peaking shape.
  zone_temperature: >
    Decision 37 (Yuri, 2026-11-13). AEP and AE: the weighted mean over the zone's weather
    points, with PJM's weights as listed; requests are made at the cell centre. DOM and
    JC keep their protocol-v1 points and unweighted mean (DOM's points already match
    PJM's three stations; JC is the one zone not on PJM's mapping, recorded as such).
    Source of stations and weights: PJM 2026 Long-Term Load Forecast Supplement, Table 3
    (notes/zone_geography.md).
  not_done_yet: weighted zone mean in the weather processing; ERA5 and AIFS pulls at the six cells

origins:
  retrospective: the 52 scored origins of protocol-v1, on the new zones
  prospective_panel: see the prospective_panel block (starts with v2; Yuri, Nov 13 2026)

# ------------------------------------------------------------------ prospective panel
prospective_panel:
  status: decided (Yuri, 2026-11-13) as an addition to v2; it never replaces the retrospective result
  what_it_is: >
    A forecast log kept in advance. Every Monday, before the week's load exists, the
    harness runs each registered model once for the coming 168 hours and commits the
    forecasts. When the week's load has been published, the stored forecasts are scored
    against it. Nothing about a model, its settings or its inputs can be adjusted after
    seeing the answer, because the answer did not exist when the forecast was stored.
  why: >
    The retrospective backtest scores weeks that are already in the past: a model's
    weights may postdate them, and we choose rows knowing roughly how they behave. The
    panel removes both problems and is the only fair test for models released after
    today (decision 27).
  how_it_differs_from_the_backtest:
    weather: >
      Only the forecast regime exists (the AIFS forecast available at the issue time).
      No lead matching from an archive and no perfect-weather row, since the actual
      weather is not known yet.
    load_history: >
      What EIA has published at the issue time, which lags by 1 to 2 days. The idealised
      cutoff of the backtest does not apply; the gap is recorded per week.
    proof_of_timing: the forecast file is committed and pushed before the week starts; the commit time is the evidence
  procedure:
    - Monday, before 00:00 America/New_York (or as soon after as the weather run allows, recorded): fetch load and the AIFS forecast, hash them, run every registered row once, commit forecasts
    - the following week, once EIA load for the forecast week is complete: score the stored forecasts; a late or missing forecast is a dropped week, listed, never back-filled
    - new models may join at any Monday; their panel starts that week and they are compared only on the weeks they share
  reading: >
    The primary pair's ratio and 90% interval are read at fixed checkpoints, after 13,
    26 and 52 scored weeks, and at no other time, with the same 10% bar and verdict
    rule. A weekly running chart may be shown, labelled "not a reading". With 13 weeks
    the interval will be wide; "inconclusive" is the expected first reading.
  zones: the v2 primary zones plus DOM and JC
  rows: every row registered in this file
  data_gap_rule: >
    Proposed, to be confirmed before the first counted week. Each model sees load only up
    to the last hour EIA had published when the job started (recorded per zone). A model
    that reads recent load forecasts from that hour through the end of the week, and only
    the 168 scored hours are kept (as the 48-hour-gap Chronos-2 row of protocol-v1 does).
    A model with no load input after training (Vanilla, LightGBM competition) forecasts
    the 168 hours directly. No model is given load that was published later.
  runner: a scheduled GitHub Actions workflow (decision 35); plan in notes/prospective_panel_plan.md, not built

# ------------------------------------------------------------------ calendar
calendar:
  requirement: >
    Decision 30. The calendar is known in advance, so any model may use it. The harness
    writes one calendar table and every model that takes calendar inputs gets exactly
    that table. Every leaderboard row states its calendar inputs.
  harness_table:   # local time at the start of the hour, harness.data.calendar
    columns: [hour, day_of_week, us_federal_holiday, year_end_24dec_to_2jan]
    delivered_in: data/model_inputs/<set>*.parquet, beside y and T
  row_label:
    field: calendar
    values:
      none: no calendar input (the model sees the load history and timestamps only)
      harness: the harness table, as covariates or columns
      own: >
        features the method builds itself; the row lists them and says whether they
        include holidays (for Vanilla, month, weekday and hour, no holidays)
  treatment: >
    Decided (Yuri, 2026-11-13): the calendar is handled as a known-future covariate, in
    the same group as humidity, solar and wind. See extra_covariates.
  expected_size: >
    Small. 12 federal holidays are 3.6% of the scored hours; Chronos-2 with temperature
    is 7% worse on them on DOM and 4% better on JC (notes/calendar_inputs.md). On the
    gate weeks the calendar made Chronos-2 worse.
  pre_registered_breakdown: >
    Error on federal-holiday hours and on other hours, per row, reported and not read
    against the bar.

# ------------------------------------------------------------------ extra covariates
extra_covariates:
  what: >
    Known-future inputs beyond temperature, each supplied by the harness as one table so
    every model gets identical values (rule 3). In v2 this is the calendar only.
    Humidity (dew point), solar radiation and wind speed are deferred to a v2.x addendum
    (Yuri, 2026-11-13, decision 34), once their forecasts are verified available at every
    lead day.
  primary_pair: >
    Unchanged: Vanilla with trend against Chronos-2 with temperature, temperature only on
    both sides. Extra covariates enter as registered secondary rows.
  rows_added:
    chronos2_temperature_calendar: temperature plus the calendar table
    vanilla_benchmark_trend_holiday: >
      Vanilla with trend plus the harness holiday and year-end indicators (rung 5 in
      BASELINES.md)
  registered_comparisons:
    - each row with the calendar against the same method with temperature only
  deferred_to_v2x:
    variables: [dew_point_2m, shortwave_radiation, wind_speed_10m]
    rows: [chronos2_all_covariates, lightgbm_competition_all_covariates]

# ------------------------------------------------------------------ other rows (secondary)
secondary_rows:
  - lag_regression_temperature          # the v1 baseline, for continuity
  - lightgbm_competition
  - tabpfn_ts_v2_temperature            # if its v1.3 scored run has finished
  - chronos2                            # univariate

# ------------------------------------------------------------------ before the tag
to_do_before_tag:
  - confirm the panel's data-gap rule (prospective_panel.data_gap_rule)
  - weighted zone mean in the weather processing; pull ERA5 and AIFS at the six AEP and AE cells
  - fetch.py pulls AEP and AE load into data/raw with hashes
  - export_inputs writes the calendar table; lookahead tests cover the new rows
  - gate runs of every row on the gate origins, from a committed tree
  - outcome sentences written in advance for the primary comparison
  - dated line in DEVIATIONS.md, then tag protocol-v2 and score once

# Problem spec the judge scores candidates against. The backtest itself is defined in
# protocol.yaml (frozen at tag protocol-v1); where the two overlap, protocol.yaml wins.
version: spec-v1
problem: hourly zonal electric load, PJM zones JC and DOM
target: {series: EIA-930 sub-BA demand, unit: MW, frequency: hourly}
horizon_hours: 168
issue_time: "Mon 00:00 America/New_York"
covariates:
  required: [temperature_2m]
  known_future: true
  regimes: [oracle, forecast]   # always reported separately
baseline_to_beat: lag_regression_temperature   # "temperature-only regression" in receipts
primary_comparison:
  model: chronos2_temperature
  regime: forecast
  bar: 0.10
  defined_in: protocol.yaml

# What makes a candidate relevant. Each is scored 0 to 3 in the scorecard.
relevance:
  target_match: 3 = hourly electric load; 2 = other hourly energy series; 1 = other time series; 0 = not forecasting
  horizon_match: 3 = about a week ahead; 2 = day-ahead; 1 = other horizons; 0 = not stated
  covariates_match: 3 = weather as a known-future input; 2 = other covariates; 1 = univariate; 0 = not stated

# What we can measure ourselves.
runnable_class:
  ff_native_exog: runs through FoundationForecast and takes temperature (models_ff/run_ff.py)
  ff_univariate: runs through FoundationForecast on load history only
  direct_adapter: needs its own adapter (as TimesFM 2.5 with covariates did)
  not_runnable: no public weights or code, or cannot run on a CPU laptop within the limit
runnable_limits: {cpu_ok: true, max_runtime_min: 60}
sources_for_weights: [huggingface, pypi, github]
weights_rule: >
  Weights are loaded at a recorded revision. The receipt states how many scored weeks
  start after the weights file's commit date. A model whose weights fall inside the
  scored window is run only with that label.

# Models we can run today, for runnable_class and implementation_hint.
runnable_models:
  amazon/chronos-2: {class: direct_adapter, script: models/chronos2.py, temperature: true}
  mistralai/Timestral-209M: {class: ff_native_exog, script: models_ff/run_ff.py, temperature: true}
  google/timesfm-2.5-200m-pytorch: {class: ff_univariate, script: models_ff/run_ff.py, temperature: false}
  other FoundationForecast wrappers: >
    Chronos, TimesFM, Timestral, T0, TiRex, Kumo, Moirai, Toto, Sundial, TabPFN, FlowState,
    PatchTSTFM, TimeH2O, Tabby, Tafsut (ff_native_exog only for Chronos-2, Timestral, T0,
    TiRex-2, TimeH2O and TimesFM 3.0; ff_univariate otherwise)
scored_window: {first_week: 2025-11-10, last_week: 2026-11-02}

# How the judge fills the scorecard's judgement fields.
judging:
  central_model: >
    A study that tests several models is judged on the model in its headline claim.
    runnable_class, license and training_overlap_risk refer to that model; the others go
    in implementation_hint and checks.notes.
  training_overlap_risk: >
    About OUR run, from the weights file's commit date on its repository (fall back to
    the release date the source states, and say so). low = before the first scored week;
    med = inside the window with at least half the weeks after it; high = fewer than half
    the weeks after it; unknown = no date found.
  evidence_strength: >
    strong = pre-registered or independently replicated, test window at least
    min_evidence.test_window_days, baseline given the same inputs. moderate = a public,
    reproducible result that misses one of those, or whose headline claim is descriptive.
    weak = numbers without code or data, or a window under the minimum. none = no primary
    source.
  independent_replication: yes or no only with a source; unknown when a search finds nothing.
  accept_run_for_a_study: its headline comparison can be re-measured with a model in runnable_models.

license_policy: {prefer: [Apache-2.0, MIT], flag_noncommercial: true}
metrics: [MAE, MAPE, RMSE, MASE, error_ratio_vs_regression]
min_evidence: {test_window_days: 90, primary_source_required: true}

labels:
  ACCEPT_RUN: relevant, with a primary source, and runnable on our benchmark now
  ACCEPT_STAGE3: relevant and sourced, but running it needs work beyond an adapter
  PARTIAL: relevant, but the evidence is thin or the primary source is missing
  REJECT: off target, or the claim has no usable support
missing_source_rule: >
  A claim with no primary source caps the label at PARTIAL, unless the candidate is
  itself a runnable model release (the release is then its own evidence).
excluded_sources: [linkedin.com]   # a LinkedIn URL is an identifier only; never fetched or cited

receipt:
  framing: transfer test, never "the claim is true / false"
  verdicts: [transfers, partially, does_not_transfer, untestable]
  must_state: [claimed, measured ratio with 90% interval, horizon mismatch, weeks after weights]

# What /scan looks for. Window set by Yuri on Nov 13, 2026: the last 3 to 4 months.
scan:
  window_days: 120
  domains:
    - [arxiv.org]
    - [huggingface.co, github.com]
    - [zenodo.org]
    - []          # open web
  # Direct listings read by tools/feeds.py: exact dates, complete for their site.
  feeds:
    arxiv:
      categories: [stat.ML, cs.LG, eess.SP, stat.AP, eess.SY]
      must_match: [forecast]                       # in title or abstract
      any_of: [load, electricity, energy, demand, foundation model, zero-shot, covariate]
    huggingface: {pipeline_tag: time-series-forecasting}
    zenodo:
      queries:
        - 'forecast* AND (electricity OR load OR demand) AND (backtest OR benchmark OR "pre-registered" OR preregistered)'
        - '"foundation model" AND forecast* AND "time series"'
  queries:
    - time series foundation model release
    - electricity load forecasting foundation model benchmark
    - zero-shot forecasting with covariates weather
    - pre-registered forecasting backtest energy demand
